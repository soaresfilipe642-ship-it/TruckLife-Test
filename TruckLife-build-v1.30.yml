name: Build Truck Life v1.30 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-v130:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack Truck Life v1.30 source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'TruckLife-v1.30-FULL-TEST-SOURCE.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "TruckLife-v1.30-FULL-TEST-SOURCE.zip not found."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          APP_GRADLE="$(find unpacked -type f -path '*/app/build.gradle.kts' | head -n 1)"
          if [ -z "$APP_GRADLE" ]; then
            echo "Android project not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify v1.30 test identity
        shell: bash
        run: |
          grep -q 'applicationId = "com.trucklife.prototest"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 13001' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.30-test"' "$PROJECT_DIR/app/build.gradle.kts"
          echo "Package/version OK"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/TruckLife-v1.30-TESTE-BLUETOOTH.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum TruckLife-v1.30-TESTE-BLUETOOTH.apk > TruckLife-v1.30-TESTE-BLUETOOTH.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckLife-v1.30-TESTE-BLUETOOTH
          path: |
            TruckLife-v1.30-TESTE-BLUETOOTH.apk
            TruckLife-v1.30-TESTE-BLUETOOTH.apk.sha256
          if-no-files-found: error
          retention-days: 14
